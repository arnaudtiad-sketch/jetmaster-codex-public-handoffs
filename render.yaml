services:
  - type: web
    name: workdone-ai-demo
    runtime: static
    branch: main
    buildCommand: echo "Publishing WorkDone AI demo"
    staticPublishPath: ./workdone-ai/live-demo
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
